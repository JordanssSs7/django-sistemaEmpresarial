<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema Empresarial{% endblock %}</title>
    <style>
        :root {
            --bg: #eef1f6;
            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --primary: #1e293b;
            --primary-soft: #334155;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --accent-soft: #eff6ff;
            --success: #16a34a;
            --success-soft: #ecfdf5;
            --success-border: #a7f3d0;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
            --danger-border: #fecaca;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e2e8f0;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 1px 3px rgba(15,23,42,0.06);
            --shadow-hover: 0 12px 24px rgba(15,23,42,0.10), 0 4px 8px rgba(15,23,42,0.06);
            --transition: 0.15s ease;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* Encabezado */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-soft) 100%);
            color: white;
            padding: 1.1rem 1.75rem;
            box-shadow: 0 2px 8px rgba(15,23,42,0.15);
            position: sticky; top: 0; z-index: 10;
        }
        header .header-inner {
            max-width: 1150px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 0.75rem;
        }
        header h1 {
            margin: 0; font-size: 1.3rem; font-weight: 700;
            display: flex; align-items: center; gap: 0.5rem;
            letter-spacing: -0.01em;
        }
        header h1::before { content: "🏥"; font-size: 1.2rem; }
        nav { display: flex; flex-wrap: wrap; gap: 0.25rem; }
        nav a {
            color: rgba(255,255,255,0.82); text-decoration: none;
            font-size: 0.9rem; font-weight: 500;
            padding: 0.4rem 0.75rem; border-radius: 999px;
            transition: background var(--transition), color var(--transition);
        }
        nav a:hover { color: white; background: rgba(255,255,255,0.12); }

        main {
            padding: 1.75rem 1.5rem 3rem; max-width: 1150px; margin: 0 auto;
        }
        footer {
            text-align: center; font-size: 0.82rem; color: var(--text-muted); padding: 2rem 1.5rem 1.5rem;
        }
        a { color: var(--accent); }
        h1, h2, h3 { color: var(--primary); letter-spacing: -0.01em; }
        h2 { font-size: 1.5rem; margin: 0 0 1.1rem; }

        /* Barra de búsqueda */
        .search-bar {
            width: 100%; padding: 0.7rem 1rem; margin-bottom: 1.25rem;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 1rem; background: var(--surface);
            box-shadow: var(--shadow);
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .search-bar:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        /* Catálogo en tarjetas */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .item-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.1rem;
            box-shadow: var(--shadow);
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .item-card h3 { margin: 0 0 0.4rem; font-size: 1.05rem; }
        .item-card p { margin: 0 0 0.6rem; color: #374151; font-size: 0.92rem; }
        .item-card small { color: var(--text-muted); }
        .empty-state { color: var(--text-muted); font-style: italic; padding: 1rem 0; }

        /* Página de demo de la API */
        pre.api-output {
            background: #0f172a; color: #e2e8f0; padding: 1rem;
            border-radius: var(--radius-sm); overflow-x: auto; font-size: 0.85rem;
        }

        /* Mensajes de confirmación */
        .messages { list-style: none; padding: 0; margin: 0 0 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .messages li {
            padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.92rem;
            background: var(--success-soft); color: #065f46; border: 1px solid var(--success-border);
            display: flex; align-items: center; gap: 0.5rem;
        }
        .messages li::before { content: "✓"; font-weight: 700; }
        .messages li.error, .messages li.warning {
            background: var(--danger-soft); color: #991b1b; border-color: var(--danger-border);
        }
        .messages li.error::before, .messages li.warning::before { content: "⚠"; }

        /* Barra de filtros y resumen del listado */
        .toolbar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .toolbar .spacer { flex: 1; }
        .chip {
            display: inline-block; padding: 0.4rem 0.9rem; border-radius: 999px;
            font-size: 0.85rem; font-weight: 500; text-decoration: none;
            background: var(--surface); border: 1px solid var(--border); color: #374151;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .chip.active { background: var(--accent); border-color: var(--accent); color: white; }
        .chip.active:hover { color: white; }
        .count-badge {
            background: var(--primary); color: white; border-radius: 999px;
            padding: 0.4rem 0.9rem; font-size: 0.85rem; font-weight: 600;
        }

        /* Tabla de citas */
        .table-wrap {
            overflow-x: auto; border-radius: var(--radius);
            box-shadow: var(--shadow); background: var(--surface);
        }
        table.citas {
            width: 100%; border-collapse: collapse; background: var(--surface);
            font-size: 0.9rem;
        }
        table.citas th, table.citas td {
            padding: 0.75rem 0.95rem; text-align: left; border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        table.citas th {
            background: var(--surface-alt); color: var(--primary); font-weight: 600;
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em;
            position: sticky; top: 0;
        }
        table.citas tbody tr { transition: background var(--transition); }
        table.citas tbody tr:hover { background: var(--surface-alt); }
        table.citas tr:last-child td { border-bottom: none; }
        tr.prioritaria { background: #fffbeb; }
        tr.prioritaria:hover { background: #fef3c7; }

        /* Etiquetas de estado y prioridad */
        .badge {
            display: inline-block; padding: 0.25rem 0.65rem; border-radius: 999px;
            font-size: 0.76rem; font-weight: 700;
        }
        .badge-programada { background: #dbeafe; color: #1e40af; }
        .badge-atendida   { background: #dcfce7; color: #166534; }
        .badge-cancelada  { background: #fee2e2; color: #991b1b; }
        .badge-prioridad  { background: #f59e0b; color: #431407; }

        /* Botones y formulario */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.65rem 1.2rem; border-radius: var(--radius-sm);
            font-size: 0.92rem; font-weight: 600; text-decoration: none; border: none; cursor: pointer;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 1px 2px rgba(37,99,235,0.3); }
        .btn-primary:hover { background: var(--accent-dark); }
        .btn-secondary { background: var(--surface); color: #374151; border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: #94a3b8; background: var(--surface-alt); }
        .btn:active { transform: scale(0.98); }

        .form-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.75rem; box-shadow: var(--shadow);
            max-width: 560px;
        }
        .form-card p { margin: 0 0 1.1rem; }
        .form-card label { display: block; font-weight: 600; margin-bottom: 0.35rem; color: var(--primary); font-size: 0.92rem; }
        .form-card input[type="text"], .form-card input[type="date"],
        .form-card input[type="time"], .form-card select, .form-card textarea {
            width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 0.95rem; font-family: inherit;
            background: var(--surface); color: var(--text);
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .form-card input:focus, .form-card select:focus, .form-card textarea:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-card .helptext { color: var(--text-muted); font-size: 0.82rem; margin-top: 0.25rem; display: block; }
        .form-card .errorlist { color: var(--danger); font-size: 0.85rem; list-style: none; padding: 0; margin: 0.3rem 0 0; }
        .form-actions { display: flex; gap: 0.6rem; margin-top: 1.25rem; flex-wrap: wrap; }
        ul.errorlist {
            color: #991b1b; font-size: 0.9rem; background: var(--danger-soft);
            border: 1px solid var(--danger-border); border-radius: var(--radius-sm);
            padding: 0.85rem 1.2rem; margin: 0 0 1.1rem; list-style: none;
        }
        .detail-card p {
            margin: 0; padding: 0.55rem 0; border-bottom: 1px solid var(--border);
        }
        .detail-card p:last-of-type { border-bottom: none; }

        /* Barra de filtros del listado */
        .filter-bar {
            display: flex; flex-wrap: wrap; align-items: end; gap: 1.1rem;
            margin-bottom: 1.25rem; padding: 1rem 1.1rem;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow);
        }
        .filter-bar label {
            display: flex; flex-direction: column; gap: 0.35rem;
            font-size: 0.78rem; color: var(--text-muted); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.02em;
        }
        .filter-bar select, .filter-bar input[type="date"] {
            padding: 0.5rem 0.65rem; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit;
            background: var(--surface); color: var(--text);
            transition: border-color var(--transition);
        }
        .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--accent); }

        /* Botones pequeños y formularios inline dentro de una celda */
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        .acciones { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
        .inline-form { display: inline-block; margin: 0; }

        @media (max-width: 640px) {
            header .header-inner { flex-direction: column; align-items: flex-start; }
            main { padding: 1.25rem 1rem 2.5rem; }
            .form-card { padding: 1.25rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>Sistema Empresarial</h1>
            <nav>
                <a href="{% url 'semana2_listado' %}">Citas médicas</a>
                <a href="{% url 'semana2_profesionales' %}">Profesionales</a>
                <a href="{% url 'semana2_horarios' %}">Horarios</a>
                <a href="{% url 'item_list' %}">Semana 1 (otro proyecto)</a>
            </nav>
        </div>
    </header>
    <main>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer>
        &copy; {% now "Y" %} - Proyecto de laboratorio
    </footer>
</body>
</html>
