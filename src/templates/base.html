{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema Empresarial{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {# CSS compartido por todo el proyecto (antes iba inline en un <style>) #}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {# Ejercicio 2 (Semana 6): Encabezado común del sitio #}
    <header>
        <div class="header-inner">
            <div class="brand">
                <h1><a href="{% url 'hub' %}" style="color:inherit; text-decoration:none;">Sistema Empresarial</a></h1>
                <span class="tagline">Laboratorios de Desarrollo de Aplicaciones Empresariales</span>
            </div>
            {# Menú: cada app lo llena a su manera vía {% block nav %} en su propio _base.html #}
            <nav>
                {% block nav %}{% endblock %}
            </nav>
        </div>
    </header>
    <main>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {# Ejercicio 2: bloque de contenido vacío que cada Template hijo sobrescribe #}
        {% block content %}{% endblock %}
    </main>
    {# Ejercicio 2: pie de página común del sitio #}
    <footer>
        &copy; {% now "Y" %} - Proyecto de laboratorio
        <div class="footer-links">
            <a href="{% url 'hub' %}">Menú principal</a>
        </div>
    </footer>
</body>
</html>
