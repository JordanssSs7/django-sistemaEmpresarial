{% extends "base.html" %}

{% block title %}Grados{% endblock %}

{% block content %}
<h2>Grados</h2>

<p><a class="btn btn-primary" href="{% url 'semana3:grado_crear' %}">+ Nuevo grado</a></p>

<div class="table-wrap">
<table class="citas">
    <thead>
        <tr><th>ID</th><th>Grado</th><th>Nivel educativo</th></tr>
    </thead>
    <tbody>
        {% for grado in grados %}
        <tr>
            <td>{{ grado.id }}</td>
            <td>{{ grado.nombre_grado }}</td>
            <td>{{ grado.nivel.nombre_nivel }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="empty-state">Sin registros.</td></tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
