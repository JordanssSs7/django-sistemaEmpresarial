{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<h2>{{ titulo }}</h2>

<form class="form-card" method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url volver %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
