{% extends "base.html" %}

{% block title %}Eliminar {{ nombre }}{% endblock %}

{% block content %}
<h2>Eliminar {{ nombre|lower }}</h2>

<div class="form-card">
    <p>¿Está seguro de que desea eliminar este registro?</p>
    <p><strong>{{ objeto }}</strong></p>
    <p class="helptext">Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Sí, eliminar</button>
            <a href="{% url volver %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
